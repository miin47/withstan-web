<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Dear Us</title>
  <link rel="icon" href="/images/dearus/favicon.png" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BBK3WESY91"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-BBK3WESY91');
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 0;
      background: linear-gradient(160deg, #ffffff 0%, #ffe0e6 60%, #ffc2d1 100%);
    }

    .card {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 32px;
      padding: 32px 28px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 380px;
      width: calc(100% - 40px);
      box-shadow: 0 20px 60px rgba(232, 53, 111, 0.12), 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    /* ===== Carousel ===== */
    .carousel-wrap {
      position: relative;
      width: 100%;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.9);
      color: #FF6B9D;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(232, 53, 111, 0.18);
      transition: transform 0.18s ease, opacity 0.18s ease;
      z-index: 2;
    }

    .arrow:hover {
      transform: translateY(-50%) scale(1.08);
    }

    .arrow:active {
      transform: translateY(-50%) scale(0.96);
    }

    .arrow.prev {
      left: -6px;
    }

    .arrow.next {
      right: -6px;
    }

    .carousel {
      display: flex;
      width: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .carousel::-webkit-scrollbar {
      display: none;
    }

    .slide {
      flex: 0 0 100%;
      scroll-snap-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 2px;
    }

    .slide img {
      width: 100%;
      max-width: 170px;
      border-radius: 16px;
      margin-bottom: 18px;
      box-shadow: 0 10px 28px rgba(232, 53, 111, 0.16);
    }

    .slide h3 {
      font-size: 1.12rem;
      font-weight: 700;
      color: #4a3f3a;
      line-height: 1.4;
    }

    .slide h3 b {
      color: #FF6B9D;
    }

    /* ===== Dots ===== */
    .dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 18px 0 22px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f3c8d5;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: width 0.25s ease, background 0.25s ease;
    }

    .dot.active {
      width: 22px;
      border-radius: 4px;
      background: #FF6B9D;
    }

    /* ===== Store buttons ===== */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .store-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 15px 24px;
      border-radius: 16px;
      text-decoration: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      width: 100%;
    }

    .store-btn:hover {
      transform: translateY(-2px);
    }

    .store-btn:active {
      transform: translateY(0px);
    }

    .store-btn .btn-icon {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .store-btn .btn-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.2;
    }

    .store-btn .btn-label {
      font-size: 0.68rem;
      font-weight: 500;
      opacity: 0.85;
      letter-spacing: 0.2px;
    }

    .store-btn .btn-store {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .btn-ios {
      background: #000;
      color: #fff;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
    }

    .btn-ios:hover {
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3);
    }

    .btn-android {
      background: #fff;
      color: #1a1a1a;
      border: 1.5px solid #e8e0db;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
    }

    .btn-android:hover {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }
  </style>
</head>

<body>
  <div class="card">
    <!-- 앱 소개 캐러셀 -->
    <div class="carousel-wrap">
      <button class="arrow prev" id="arrow-prev" aria-label="previous">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
      <div class="carousel" id="carousel"></div>
      <button class="arrow next" id="arrow-next" aria-label="next">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
    </div>
    <div class="dots" id="dots"></div>

    <!-- 스토어 버튼 (슬라이드와 무관하게 항상 고정) -->
    <div class="btn-group">
      <a class="store-btn btn-ios" id="btn-ios"
        href="https://apps.apple.com/app/id6760184777?ppid=0a1c4f5c-1b52-470f-9f16-941fbe8565ff">
        <span class="btn-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.37 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11" />
          </svg>
        </span>
        <span class="btn-text">
          <span class="btn-label" id="ios-label"></span>
          <span class="btn-store">App Store</span>
        </span>
      </a>

      <a class="store-btn btn-android" id="btn-android"
        href="https://play.google.com/store/apps/details?id=com.withstan.dearus&listing=store-link">
        <span class="btn-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M3.18 23.76c.33.18.7.22 1.06.11l.07-.05 10.05-5.8-2.17-2.17z" fill="#EA4335" />
            <path d="M20.07 10.56 17.33 9l-2.43 2.17 2.44 2.44 2.73-1.58a1.45 1.45 0 0 0 0-2.51z" fill="#FBBC04" />
            <path d="M3.24.34a1.45 1.45 0 0 0-.5 1.12v21.08c0 .44.18.84.5 1.12l.06.05 11.8-11.8v-.28z" fill="#4285F4" />
            <path d="M15.16 12.17 4.93 22.4l.06.05c.36.11.73.07 1.06-.11l12.34-7.12z" fill="#34A853" />
          </svg>
        </span>
        <span class="btn-text">
          <span class="btn-label" id="android-label"></span>
          <span class="btn-store">Google Play</span>
        </span>
      </a>
    </div>
  </div>

  <script>
    const i18n = {
      ko: {
        iosLabel: 'App Store에서 다운로드',
        androidLabel: 'Google Play에서 다운로드',
        features: [
          {
            title: '우리의 데이트가<br /><b>영원한 추억의 캘린더로</b>',
            desc: '사진, 감정, 함께한 일정과 지출까지<br />그날의 추억을 기록하고 매일 펼쳐보세요.',
          },
          {
            title: '나 혼자만의<br /><b>감정을 적는 비밀 일기장</b>',
            desc: '순간이 지나가기 전에 당신의 솔직한 감정과 소소한 디테일들을<br />프라이빗한 공간에 기록해보세요.',
          },
          {
            title: '서로를<br /><b>더 깊이 알아가는 시간</b>',
            desc: '매일 달라지는 심층 질문, 밸런스게임으로<br />설레는 대화를 시작하세요.',
          },
          {
            title: '서로를<br /><b>더 깊이 알아가는 시간</b>',
            desc: '매일 달라지는 심층 질문, 밸런스게임으로<br />설레는 대화를 시작하세요.',
          },
          {
            title: '데이트가 끝나도<br /><b>걱정 없는 안심 귀가</b>',
            desc: '집까지 서로의 안전을 다정하게 챙겨주세요.<br />마지막 귀가까지 함께 해요.',
          },
        ],
      },
      en: {
        iosLabel: 'Download on the',
        androidLabel: 'Get it on',
        features: [
          {
            title: 'Your dates become<br /><b>a calendar of timeless memories</b>',
            desc: 'Photos, feelings, shared plans and expenses —<br />record each day and revisit it whenever you like.',
          },
          {
            title: 'A private diary<br /><b>for your own honest feelings</b>',
            desc: 'Before the moment slips away, write down your true emotions<br />and the little details in a space just for you.',
          },
          {
            title: 'Time to know<br /><b>each other more deeply</b>',
            desc: 'Daily questions and balance games<br />spark conversations that bring you closer.',
          },
          {
            title: 'Time to know<br /><b>each other more deeply</b>',
            desc: 'Daily questions and balance games<br />spark conversations that bring you closer.',
          },
          {
            title: 'Even after the date ends,<br /><b>a worry-free trip home</b>',
            desc: "Look after each other's safety all the way home.<br />Stay together until you're both safely back.",
          },
        ],
      },
      es: {
        iosLabel: 'Descargar en',
        androidLabel: 'Descargar en',
        features: [
          {
            title: 'Vuestras citas se convierten<br /><b>en un calendario de recuerdos eternos</b>',
            desc: 'Fotos, emociones, planes y gastos compartidos:<br />guardad cada día y revividlo cuando queráis.',
          },
          {
            title: 'Un diario privado<br /><b>para tus emociones más sinceras</b>',
            desc: 'Antes de que el momento se escape, anota tus sentimientos reales<br />y los pequeños detalles en un espacio solo tuyo.',
          },
          {
            title: 'Tiempo para conoceros<br /><b>mucho más a fondo</b>',
            desc: 'Preguntas diarias y juegos de balance<br />para empezar conversaciones llenas de emoción.',
          },
          {
            title: 'Tiempo para conoceros<br /><b>mucho más a fondo</b>',
            desc: 'Preguntas diarias y juegos de balance<br />para empezar conversaciones llenas de emoción.',
          },
          {
            title: 'Incluso al terminar la cita,<br /><b>un regreso a casa sin preocupaciones</b>',
            desc: 'Cuidad de la seguridad del otro hasta llegar a casa.<br />Estad juntos hasta el último paso.',
          },
        ],
      },
      pt: {
        iosLabel: 'Baixar na',
        androidLabel: 'Baixar no',
        features: [
          {
            title: 'Os seus encontros viram<br /><b>um calendário de memórias eternas</b>',
            desc: 'Fotos, emoções, planos e despesas compartilhadas —<br />registre cada dia e relembre quando quiser.',
          },
          {
            title: 'Um diário privado<br /><b>para os seus sentimentos mais sinceros</b>',
            desc: 'Antes que o momento passe, registre suas emoções verdadeiras<br />e os pequenos detalhes num espaço só seu.',
          },
          {
            title: 'Hora de se conhecerem<br /><b>muito mais a fundo</b>',
            desc: 'Perguntas diárias e jogos de balanço<br />para começar conversas cheias de emoção.',
          },
          {
            title: 'Hora de se conhecerem<br /><b>muito mais a fundo</b>',
            desc: 'Perguntas diárias e jogos de balanço<br />para começar conversas cheias de emoção.',
          },
          {
            title: 'Mesmo após o encontro,<br /><b>um retorno seguro para casa</b>',
            desc: 'Cuidem da segurança um do outro até chegar em casa.<br />Fiquem juntos até o último passo.',
          },
        ],
      },
    };

    const lang = (navigator.language || navigator.userLanguage || 'en').slice(0, 2).toLowerCase();
    const t = i18n[lang] || i18n.en;
    const imgLang = i18n[lang] ? lang : 'en';

    document.getElementById('ios-label').textContent = t.iosLabel;
    document.getElementById('android-label').textContent = t.androidLabel;

    // 슬라이드 렌더링
    const carousel = document.getElementById('carousel');
    carousel.innerHTML = t.features.map(function (f, i) {
      return '<div class="slide">' +
        '<img src="/images/dearus/' + imgLang + '/appimage' + (i + 1) + '.png" alt="Dear Us" loading="lazy" />' +
        '<h3>' + f.title + '</h3>' +
        '</div>';
    }).join('');

    // 도트 렌더링
    const dotsWrap = document.getElementById('dots');
    dotsWrap.innerHTML = t.features.map(function (_, i) {
      return '<button class="dot' + (i === 0 ? ' active' : '') + '" data-index="' + i + '" aria-label="slide ' + (i + 1) + '"></button>';
    }).join('');
    const dots = Array.prototype.slice.call(dotsWrap.children);

    // 도트 클릭 → 해당 슬라이드로 이동
    dots.forEach(function (dot) {
      dot.addEventListener('click', function () {
        const i = Number(dot.dataset.index);
        carousel.scrollTo({ left: carousel.clientWidth * i, behavior: 'smooth' });
      });
    });

    // 현재 슬라이드 인덱스
    function currentIndex() {
      return Math.round(carousel.scrollLeft / carousel.clientWidth);
    }

    function goTo(i) {
      const max = t.features.length - 1;
      const target = Math.max(0, Math.min(max, i));
      carousel.scrollTo({ left: carousel.clientWidth * target, behavior: 'smooth' });
    }

    // 좌우 화살표
    document.getElementById('arrow-prev').addEventListener('click', function () {
      goTo(currentIndex() - 1);
    });
    document.getElementById('arrow-next').addEventListener('click', function () {
      goTo(currentIndex() + 1);
    });

    // 스크롤 위치에 따라 활성 도트 갱신
    let scrollTimer = null;
    carousel.addEventListener('scroll', function () {
      if (scrollTimer) cancelAnimationFrame(scrollTimer);
      scrollTimer = requestAnimationFrame(function () {
        const idx = currentIndex();
        dots.forEach(function (dot, i) {
          dot.classList.toggle('active', i === idx);
        });
      });
    });

    document.getElementById('btn-ios').addEventListener('click', function () {
      gtag('event', 'store_click', { 'store': 'app_store', 'lang': lang });
    });

    document.getElementById('btn-android').addEventListener('click', function () {
      gtag('event', 'store_click', { 'store': 'google_play', 'lang': lang });
    });
  </script>
</body>

</html>
